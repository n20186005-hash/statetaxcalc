<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="category" content="finance">
    <meta name="icon" content="📚">
    
    <title>Tax Policy & Articles Library | StateTaxCalc 2026</title>
    <meta name="description" content="Browse our complete library of tax guides, policy updates, and financial planning articles.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='0' y='0' width='64' height='64' rx='12' fill='%232563eb'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='24' fill='white'%3ETax%3C/text%3E%3C/svg%3E">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Load Article Database (Relative Path) -->
    <script src="js/article-db.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#2563eb', hover: '#1d4ed8' }, 
                        secondary: { DEFAULT: '#6366f1', hover: '#4f46e5' },
                        surface: { light: '#ffffff', dark: '#1e293b' },
                        bg: { light: '#f8fafc', dark: '#0f172a' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .glass {
                @apply bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border border-slate-200 dark:border-slate-700;
            }
            .nav-link {
                @apply text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-primary transition-colors;
            }
            .list-card {
                @apply flex flex-col md:flex-row gap-6 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-primary/50 hover:shadow-lg transition-all duration-300 cursor-pointer;
            }
        }
    </style>
</head>
<body class="bg-bg-light dark:bg-bg-dark min-h-screen font-sans text-slate-800 dark:text-slate-200 selection:bg-primary/20 transition-colors duration-300 flex flex-col">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 glass shadow-sm">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <!-- Updated to relative path: index.html -->
            <a href="index.html" class="flex items-center gap-2 group">
                <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white shadow-glow group-hover:scale-105 transition-transform">
                    <i class="fa fa-calculator"></i>
                </div>
                <span class="text-lg font-extrabold tracking-tight text-slate-900 dark:text-white">State<span class="text-primary">TaxCalc</span> 2026</span>
            </a>

            <div class="hidden md:flex items-center gap-8">
                <!-- Updated to relative path: index.html#states -->
                <a href="index.html#states" class="nav-link" data-i18n="nav_calculators">Calculators</a>
                <a href="articles.html" class="nav-link text-primary" data-i18n="nav_policy">Articles</a>
                <!-- Updated to relative path: about.html -->
                <a href="about.html" class="nav-link" data-i18n="nav_about">About</a>
            </div>

            <div class="flex items-center gap-2 md:gap-3">
                <select id="lang-selector" class="bg-transparent text-xs font-bold text-slate-600 dark:text-slate-300 px-2 py-1 rounded focus:outline-none cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                    <option value="en">EN</option>
                    <option value="zh-TW">繁中</option>
                </select>
                <div class="w-px h-5 bg-slate-300 dark:bg-slate-600 mx-1"></div>
                <button id="mode-toggle" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 hover:text-primary hover:bg-slate-100 dark:hover:bg-slate-700 transition-all">
                    <i class="fa fa-moon-o dark:hidden"></i><i class="fa fa-sun-o hidden dark:inline"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-12 flex-1">
        
        <!-- Header & Search -->
        <div class="max-w-4xl mx-auto mb-12 text-center">
            <span class="inline-block py-1 px-3 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 text-xs font-bold uppercase tracking-wider mb-4 border border-slate-200 dark:border-slate-700" data-i18n="page_badge">
                Knowledge Hub
            </span>
            <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 dark:text-white mb-6" data-i18n="page_title">
                Tax Insights & Guides
            </h1>
            <p class="text-slate-600 dark:text-slate-400 mb-8 max-w-xl mx-auto" data-i18n="page_desc">
                Everything you need to know about 2026 tax changes, state policies, and financial planning.
            </p>

            <div class="relative max-w-xl mx-auto">
                <i class="fa fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="article-search" class="w-full pl-12 pr-6 py-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-lg shadow-soft focus:ring-2 focus:ring-primary outline-none transition-all" placeholder="Search articles...">
            </div>
        </div>

        <!-- Filters (Optional UI enhancement) -->
        <div class="flex flex-wrap justify-center gap-2 mb-10" id="category-filters">
            <!-- Injected via JS -->
        </div>

        <!-- Articles List -->
        <div id="articles-list-container" class="max-w-4xl mx-auto space-y-6">
            <!-- Article Items Injected Here -->
        </div>
        
        <!-- No Results State -->
        <div id="no-results" class="hidden text-center py-12">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 mb-4">
                <i class="fa fa-search text-2xl"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-900 dark:text-white" data-i18n="no_results_title">No articles found</h3>
            <p class="text-slate-500" data-i18n="no_results_desc">Try searching for a different keyword.</p>
        </div>

    </div>

    <footer class="bg-slate-900 text-slate-300 mt-auto pt-16 pb-8">
        <div class="container mx-auto px-4">
            <div class="text-center text-xs text-slate-500">
                <p>&copy; 2026 StateTaxCalc. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        const App = {
            init() {
                this.setupTheme();
                this.setupLanguage();
                this.setupSearch();
                this.renderArticles();
            },

            renderArticles(filter = "") {
                const container = document.getElementById('articles-list-container');
                const noResults = document.getElementById('no-results');
                const lang = document.documentElement.lang === 'zh-TW' ? 'zh' : 'en';

                if (!window.TAX_ARTICLES_DB) return;

                const filtered = window.TAX_ARTICLES_DB.filter(article => {
                    const term = filter.toLowerCase();
                    const title = (article.title.en + article.title.zh).toLowerCase();
                    const tags = article.tags.join(' ').toLowerCase();
                    return title.includes(term) || tags.includes(term);
                });

                if (filtered.length === 0) {
                    container.innerHTML = '';
                    noResults.classList.remove('hidden');
                    return;
                }

                noResults.classList.add('hidden');
                container.innerHTML = filtered.map(article => {
                    const title = article.title[lang] || article.title.en;
                    const desc = article.desc[lang] || article.desc.en;
                    const cat = article.category[lang] || article.category.en;
                    const date = article.date;

                    return `
                    <article class="list-card group" onclick="window.location.href='${article.url}'">
                        <div class="md:w-48 h-48 md:h-auto shrink-0 bg-slate-100 dark:bg-slate-900/50 rounded-xl flex items-center justify-center text-slate-300 dark:text-slate-600 group-hover:bg-blue-50 dark:group-hover:bg-blue-900/20 group-hover:text-primary transition-colors">
                            <i class="fa ${article.icon} text-4xl"></i>
                        </div>
                        <div class="flex-1 flex flex-col justify-center py-2">
                            <div class="flex items-center gap-3 text-xs font-bold uppercase tracking-wide mb-2">
                                <span class="text-primary bg-primary/10 px-2 py-1 rounded">${cat}</span>
                                <span class="text-slate-400">${date}</span>
                            </div>
                            <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-3 group-hover:text-primary transition-colors">
                                ${title}
                            </h2>
                            <p class="text-slate-500 dark:text-slate-400 leading-relaxed mb-4 line-clamp-2">
                                ${desc}
                            </p>
                            <div class="mt-auto flex items-center gap-2 text-sm font-bold text-slate-900 dark:text-white group-hover:translate-x-1 transition-transform">
                                ${lang === 'zh' ? '閱讀全文' : 'Read Article'} <i class="fa fa-long-arrow-right text-primary"></i>
                            </div>
                        </div>
                    </article>
                    `;
                }).join('');
            },

            setupSearch() {
                const search = document.getElementById('article-search');
                search.addEventListener('input', (e) => {
                    this.renderArticles(e.target.value);
                });
            },

            setupTheme() {
                const toggle = document.getElementById('mode-toggle');
                if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
                toggle.addEventListener('click', () => {
                    document.documentElement.classList.toggle('dark');
                    localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
                });
            },

            setupLanguage() {
                const selector = document.getElementById('lang-selector');
                const savedLang = localStorage.getItem('app_lang_tax') || 'en';
                selector.value = savedLang;
                this.updateUIText(savedLang);
                
                selector.addEventListener('change', (e) => {
                    const newLang = e.target.value;
                    localStorage.setItem('app_lang_tax', newLang);
                    this.updateUIText(newLang);
                    this.renderArticles(document.getElementById('article-search').value);
                });
            },

            updateUIText(lang) {
                document.documentElement.lang = lang;
                const texts = {
                    'en': {
                        page_badge: "Knowledge Hub",
                        page_title: "Tax Insights & Guides",
                        page_desc: "Everything you need to know about 2026 tax changes, state policies, and financial planning.",
                        no_results_title: "No articles found",
                        no_results_desc: "Try searching for a different keyword.",
                        nav_calculators: "Calculators", nav_policy: "Articles", nav_about: "About",
                    },
                    'zh-TW': {
                        page_badge: "知識庫",
                        page_title: "稅務見解與指南",
                        page_desc: "關於 2026 年稅務變更、州政策和財務規劃的完整資訊。",
                        no_results_title: "未找到相關文章",
                        no_results_desc: "請嘗試搜索其他關鍵字。",
                        nav_calculators: "計算器", nav_policy: "文章庫", nav_about: "關於",
                    }
                };
                
                const data = texts[lang] || texts['en'];
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if(data[key]) el.innerHTML = data[key];
                });

                // Update placeholder
                const search = document.getElementById('article-search');
                if(search) search.placeholder = lang === 'zh-TW' ? "搜索文章標題..." : "Search articles...";
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
